name: golangci-lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  golangci:
    strategy:
      matrix:
        module: [http]

    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24

      - uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: ${{ matrix.module }}
